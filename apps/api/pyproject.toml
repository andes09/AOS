[project]
name = "agile-os-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "clerk-backend-api>=1.0.0",
    "cryptography>=43.0.0",
    "anthropic>=0.34.0",
    # Onboarding idea interview talks to Groq through its OpenAI-compatible API.
    "openai>=1.30.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "svix>=1.20.0",
    "pyyaml>=6.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "mcp==1.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    # conftest.py runs the suite against sqlite+aiosqlite:///:memory:.
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
