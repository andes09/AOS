# Stage-2 baseline archetype. Same shape as stage1_team.yaml — 4 devs with
# normal completion rates and speeds. Used as the reference cell in the
# matrix; other archetypes (small, large, struggling, meeting_heavy) deviate
# from this on a single axis at a time.
name: "balanced"
description: "Reference team: 4 devs, normal completion and speed."

sprint_length_minutes: 1
total_sprints: 2
ticket_pool_size: 100

developers:
  - name: "Alex"
    completion_rate: 0.85
    speed: 1.0
    skills: ["backend"]
  - name: "Jordan"
    completion_rate: 0.70
    speed: 0.9
    skills: ["frontend"]
  - name: "Sam"
    completion_rate: 0.90
    speed: 1.1
    skills: ["backend", "infra"]
  - name: "Riley"
    completion_rate: 0.75
    speed: 0.95
    skills: ["frontend", "infra"]

ticket_distribution:
  type:
    Story: 0.5
    Bug: 0.3
    Task: 0.2
  story_points: [1, 2, 3, 5, 8]

dependency_density: 0.1
