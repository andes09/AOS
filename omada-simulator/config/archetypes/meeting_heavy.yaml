# Stage-2 archetype: meeting-heavy team. Varies from balanced on SPEED only —
# per-dev completion stays in the balanced 0.70-0.90 range (when devs DO get
# to a ticket they finish it), but speed is throttled to 0.50-0.60 modeling
# ~45% wall-clock loss to meeting overhead. Same ticket mix, same dep density
# as balanced — isolates the throughput-loss axis.
name: "meeting_heavy"
description: "Normal completion quality but ~45% throughput loss to meeting overhead. When devs DO get to a ticket they finish it."

sprint_length_minutes: 1
total_sprints: 5
ticket_pool_size: 100

developers:
  - name: "Alex"
    completion_rate: 0.85
    speed: 0.55
    skills: ["backend"]
  - name: "Jordan"
    completion_rate: 0.70
    speed: 0.50
    skills: ["frontend"]
  - name: "Sam"
    completion_rate: 0.90
    speed: 0.60
    skills: ["backend", "infra"]
  - name: "Riley"
    completion_rate: 0.75
    speed: 0.55
    skills: ["frontend", "infra"]

ticket_distribution:
  type:
    Story: 0.5
    Bug: 0.3
    Task: 0.2
  story_points: [1, 2, 3, 5, 8]

dependency_density: 0.1
