# Stage-2 archetype: small team. Varies from balanced on team SIZE only —
# 2 devs instead of 4. Per-dev completion/speed match balanced, so any
# delta vs balanced isolates the effect of halved throughput on assignment
# strategies. ticket_pool_size bumped to 60 (plan §12 risk #4: 2 devs ×
# 5-8 tickets × 3 sprints can reach 48; need headroom).
name: "small"
description: "Two-person team — half the throughput, same per-dev quality."

sprint_length_minutes: 1
total_sprints: 5
ticket_pool_size: 60

developers:
  - name: "Casey"
    completion_rate: 0.85
    speed: 1.0
    skills: ["backend", "infra"]
  - name: "Drew"
    completion_rate: 0.80
    speed: 0.95
    skills: ["frontend", "backend"]

ticket_distribution:
  type:
    Story: 0.5
    Bug: 0.3
    Task: 0.2
  story_points: [1, 2, 3, 5, 8]

dependency_density: 0.1
