# Stage-2 archetype: struggling team. Varies from balanced on MULTIPLE axes
# at once — low completion (0.45-0.60), slower speed (0.70-0.85), denser
# deps (0.25 vs 0.10), and a Bug-heavy ticket mix with a heavier point tail
# (no 1s, adds 13). Models a team in trouble; expect Sprint Brain to help
# most here vs random.
name: "struggling"
description: "Low completion rate + slower speed + denser dependencies. Models a team in trouble."

sprint_length_minutes: 1
total_sprints: 5
ticket_pool_size: 100

developers:
  - name: "Alex"
    completion_rate: 0.55
    speed: 0.80
    skills: ["backend"]
  - name: "Jordan"
    completion_rate: 0.50
    speed: 0.70
    skills: ["frontend"]
  - name: "Sam"
    completion_rate: 0.60
    speed: 0.85
    skills: ["backend", "infra"]
  - name: "Riley"
    completion_rate: 0.45
    speed: 0.75
    skills: ["frontend", "infra"]

ticket_distribution:
  type:
    Story: 0.4
    Bug: 0.4
    Task: 0.2
  story_points: [2, 3, 5, 8, 13]

dependency_density: 0.25
