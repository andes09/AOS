name: "local"
description: "Local Omada instance with local Postgres"

omada:
  api_url: "http://localhost:8000"

jira:
  url: "https://omada-sim.atlassian.net"
  project_key_prefix: "SIM"

safety:
  allow_production: false
  required_url_substrings:
    - "localhost"
    - "127.0.0.1"
  block_url_substrings:
    - "production"
    - "api-production"
  max_real_users_in_org: 5
  require_simulated_org: false
